name: Update CS2 daily ELO

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-elo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calculate today's Premier ELO
        shell: python
        run: |
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          STEAM64 = "76561198802703318"
          url = f"https://api-public.cs-prod.leetify.com/v3/profile?steam64_id={STEAM64}"

          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.load(r)

              current = data.get("ranks", {}).get("premier")
              current = float(current)

              matches = []
              for m in data.get("recent_matches", []):
                  try:
                      if m.get("finished_at") and m.get("rank_type") == 11:
                          rank = float(m.get("rank"))
                          matches.append((datetime.fromisoformat(m["finished_at"].replace("Z", "+00:00")), rank))
                  except Exception:
                      pass

              matches.sort(key=lambda x: x[0])

              tz = ZoneInfo("Europe/Oslo")
              today = datetime.now(tz).date()

              today_indexes = [
                  i for i, (finished_at, _) in enumerate(matches)
                  if finished_at.astimezone(tz).date() == today
              ]

              if not today_indexes:
                  output = "+0"
              else:
                  first_idx = today_indexes[0]
                  if first_idx > 0:
                      baseline = matches[first_idx - 1][1]
                  else:
                      baseline = matches[first_idx][1]

                  change = round(current - baseline)
                  output = f"{change:+d}"

          except Exception as e:
              print(f"Failed to update ELO: {e}")
              raise

          Path("elo.txt").write_text(output + "\n", encoding="utf-8")
          print(f"ELO output: {output}")

      - name: Commit updated value
        run: |
          if git diff --quiet -- elo.txt; then
            echo "No ELO change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elo.txt
          git commit -m "Update daily CS2 ELO"
          git push
